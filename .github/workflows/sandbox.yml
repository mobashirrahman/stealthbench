name: sandbox

# Execution-runtime containment checks. Separate from the offline CI job because
# these tests need a real container runtime and prove enforcement rather than
# configuration. A missing runtime is `blocked_external`, never a pass.

on:
  workflow_dispatch:
  schedule:
    # Weekly containment re-check against the base image digest.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: sandbox
  cancel-in-progress: false

jobs:
  containment:
    name: sandbox containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e '.[dev]'
      - name: Report container runtime
        run: docker version || true
      - name: Run containment suite
        run: pytest --strict-markers tests/sandbox
