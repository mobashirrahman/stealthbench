name: ci

# Offline only. No provider credentials exist in this workflow and none may be
# added: `stealthbench` never contacts a provider from a default test run.
#
# Runtime containment and operator-authorized campaigns live in separate workflows
# (sandbox.yml, live.yml) so this job cannot silently become billable work.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy src/stealthbench

  offline-suites:
    name: offline unit, contract, integration and replay
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit and contract
            command: pytest --strict-markers tests/unit tests/contract
          - name: integration and replay
            command: pytest --strict-markers tests/integration tests/replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e '.[dev]'
      - name: Run suite
        run: ${{ matrix.command }}
